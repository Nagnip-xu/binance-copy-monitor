[project]
name = "binance-slot-monitor"
version = "0.2.0"
description = "Local futures copy-trading capacity monitor and opt-in automatic joining"
requires-python = ">=3.11"
dependencies = ["playwright==1.65.0"]

[project.scripts]
binance-slot-monitor = "binance_monitor.__main__:main"

[tool.setuptools.packages.find]
include = ["binance_monitor*"]
